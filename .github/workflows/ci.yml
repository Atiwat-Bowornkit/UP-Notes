# .github/workflows/ci.yml — Lint + Test ทุก Pull Request (Lab 12B Safety Net Sprint)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ใช้ eslint.config.js ที่ root — ไม่ต้องพึ่ง `next lint` (ยังไม่มีโฟลเดอร์ app/)
      - name: Run ESLint
        run: npx --yes eslint@9 src tests

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
